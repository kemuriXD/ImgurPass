<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Imgur embed code</title>
  </head>
  <body>
    <!-- The code Imgur gives out for embedding an album. Its script never loads where Imgur is blocked. -->
    <blockquote class="imgur-embed-pub" lang="en" data-id="a/tUlsG"><a href="https://imgur.com/a/tUlsG">An album</a></blockquote>
    <script async src="https://s.imgur.com/min/embed.js" charset="utf-8"></script>
  </body>
</html>
