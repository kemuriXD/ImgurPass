<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>ImgurPass settings</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
      dt { font-weight: 600; }
      dd { margin: 0 0 0.5rem; }
      label { display: block; margin: 0.4rem 0; }
      button { margin: 0.25rem 0.5rem 0.25rem 0; }
    </style>
  </head>
  <body>
    <h1>ImgurPass</h1>
    <p>Unofficial, not affiliated with Imgur.</p>
    <dl>
      <dt>Block status</dt>
      <dd id="status">…</dd>
      <dt>Unblocking</dt>
      <dd id="active">…</dd>
      <dt>Embeds on all sites</dt>
      <dd id="all-sites">…</dd>
      <dt>rimgo instances</dt>
      <dd id="instances">…</dd>
    </dl>
    <button id="recheck">Check now</button>
    <button id="grant">Fix embeds everywhere</button>
    <label><input type="checkbox" id="enabled" /> Enabled</label>
    <label><input type="checkbox" id="always-proxy" /> Always proxy, even when Imgur isn't blocked</label>
    <label><input type="checkbox" id="only-no-data" /> Only use rimgo instances that don't collect data</label>
    <label>Custom rimgo instance <input type="url" id="custom" placeholder="https://rimgo.example.org" /></label>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
